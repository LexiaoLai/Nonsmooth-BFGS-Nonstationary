name: Verify proofs and notebook

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: verification/requirements-notebook.txt
      - run: python -m pip install -r verification/requirements-notebook.txt
      - name: Recompute certificates and execute the notebook
        run: BFGS_PYTHON=python ./scripts/check.sh --python-only
      - name: Check committed exact certificates
        run: git diff --exit-code -- verification/certificate.json verification/bounds.txt verification/certified_bounds.tex
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LEAN_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v6
      - uses: leanprover/lean-action@v1
        with:
          build: true
          build-args: '--wfail'
          test: false
          lint: false
          use-mathlib-cache: 'true'
          # Archiving the entire .lake tree exhausts the runner's disk space.
          # Keep the upstream mathlib cache and rebuild the local proofs.
          use-github-cache: 'false'
      - name: Audit all axioms and reject a corrupted interval certificate
        run: python3 verification/check_lean.py --incremental
